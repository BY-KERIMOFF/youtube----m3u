name: Update All Channels

on:
  schedule:
    - cron: '*/15 * * * *'

  workflow_dispatch:

concurrency:
  group: update-all-channels
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Repoyu klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Python paketlərini qur
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Chromium qur
        run: |
          python -m playwright install --with-deps chromium

      - name: Streams qovluğunu yarat
        run: |
          mkdir -p streams

      - name: Köhnə error fayllarını sil
        run: |
          rm -f streams/*.error.txt || true

      - name: Kanal scanner-i işə sal
        run: |
          python3 channels.py

      - name: Last run
        run: |
          echo "Son yenilenme: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            > streams/last_run.txt

      - name: Nəticələri göstər
        run: |
          echo ""
          echo "======================================"
          echo "YARADILAN FAYLLAR"
          echo "======================================"
          ls -lah streams/
          echo ""
          echo "======================================"
          echo "M3U FAYLLARI"
          echo "======================================"
          for file in streams/*.m3u
          do
            echo ""
            echo "========== $file =========="
            cat "$file"
          done
          echo ""
          echo "======================================"
          echo "ERROR FAYLLARI"
          echo "======================================"
          for file in streams/*.error.txt
          do
            if [ -f "$file" ]; then
              echo ""
              cat "$file"
            fi
          done

      - name: Git config
        run: |
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git config user.name \
            "github-actions[bot]"

      - name: Dəyişiklikləri commit et
        run: |
          git add streams/
          if git diff --cached --quiet; then
            echo "Dəyişiklik yoxdur."
            exit 0
          fi
          git commit \
            -m "Update all streams $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

      - name: GitHub ilə sinxronlaşdır
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push
        run: |
          git push origin HEAD:main
