name: Update HDFilmCehennemi M3U

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape
        run: |
          python scraper.py

      - name: Check M3U
        run: |
          echo "=============================="
          echo "M3U RESULT"
          echo "=============================="

          if [ -f films.m3u ]; then
            echo "films.m3u yaradildi"
            wc -l films.m3u
            head -30 films.m3u
          else
            echo "films.m3u YOXDUR"
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add films.m3u

          if git diff --cached --quiet; then
            echo "Deyisiklik yoxdur."
          else
            git commit -m "Update HDFilmCehennemi M3U"
            git push
          fi
