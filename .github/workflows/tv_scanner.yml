name: Update HDFilmCehennemi M3U

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Check Playwright
        run: |
          python -c "import playwright; print('Playwright OK')"

      - name: Run scraper
        run: |
          python scraper.py

      - name: Check result
        run: |
          echo "=============================="
          echo "M3U RESULT"
          echo "=============================="

          if [ -f films.m3u ]; then
            echo "films.m3u yaradildi"
            wc -l films.m3u
            echo ""
            head -40 films.m3u
          else
            echo "films.m3u YARANMADI"
            exit 1
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add films.m3u

          if git diff --cached --quiet; then
            echo "Yeni dəyişiklik yoxdur."
          else
            git commit -m "Update HDFilmCehennemi M3U"
            git push
          fi
