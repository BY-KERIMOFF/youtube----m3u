name: Turk TV Live M3U Scanner

on:
  schedule:
    # Hər 6 saatdan bir işləyir (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tv_channels.py'
      - '.github/workflows/*.yml'

concurrency:
  group: tv-scanner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run TV scanner
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python tv_channels.py

      - name: Show results
        if: always()
        run: |
          echo "=== tv2/ qovluğu ==="
          ls -la tv2/ || true
          echo ""
          echo "=== tv2/links.txt ==="
          cat tv2/links.txt 2>/dev/null || echo "links.txt tapilmadi"
          echo ""
          echo "=== tv2/github_links.txt ==="
          cat tv2/github_links.txt 2>/dev/null || echo "github_links.txt tapilmadi"

      - name: Git config
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit changes
        if: always()
        run: |
          git add tv2/ || true
          if git diff --staged --quiet; then
            echo "Dəyişiklik yoxdur, commit edilmir."
            echo "SKIP_PUSH=1" >> $GITHUB_ENV
          else
            git commit -m "Auto-update tv2 streams: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "SKIP_PUSH=0" >> $GITHUB_ENV
          fi

      - name: Pull latest changes (rebase)
        if: always() && env.SKIP_PUSH == '0'
        run: |
          git fetch origin main
          git rebase origin/main || {
            echo "Rebase konflikti, merge istifadə edilir..."
            git rebase --abort || true
            git pull --no-rebase origin main -X ours || true
          }

      - name: Push changes
        if: always() && env.SKIP_PUSH == '0'
        run: |
          git push origin HEAD:main
